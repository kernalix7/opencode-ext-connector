name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require npm with trusted publishing support
        run: npm install -g npm@^11.10.0 && npm --version
      - name: Verify tag matches package version
        run: |
          version="$(jq -r .version package.json)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Install OpenCode CLI
        run: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
      - run: opencode --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun test
      - run: bun run test:e2e
      - run: bun run verify:package
      - name: Configure npm token for the first publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${HOME}/.npmrc"
            chmod 600 "${HOME}/.npmrc"
          else
            echo "NPM_TOKEN is not set; relying on npm trusted publishing (OIDC)."
          fi
      - run: npm publish --provenance --access public
