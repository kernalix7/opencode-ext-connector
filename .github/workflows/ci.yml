name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OpenCode CLI
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.24 --no-modify-path
      - name: Verify OpenCode CLI
        run: opencode --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun test
      - run: bun run test:provider
      - run: bun run test:integration
      - run: bun run test:e2e
      - run: bun run verify:package
