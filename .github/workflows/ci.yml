name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.20.0"
      - name: Install OpenCode CLI
        run: npm install -g opencode-ai@1.18.27
      - name: Verify OpenCode CLI
        run: opencode --version
      - name: Install isolated OpenCode V2 CLI
        run: |
          install_dir="$RUNNER_TEMP/opencode-v2"
          mkdir -p "$install_dir"
          cat > "$install_dir/package.json" <<'EOF'
          {
            "name": "opencode-v2-ci",
            "private": true,
            "dependencies": {
              "@opencode/cli": "2.0.20"
            },
            "trustedDependencies": ["@opencode/cli"]
          }
          EOF
          # Trust postinstall: it copies the verified npm optional binary.
          bun install --cwd "$install_dir" --trust
          echo "OPENCODE_V2_BIN=${install_dir}/node_modules/.bin/opencode2" >> "$GITHUB_ENV"
      - name: Verify OpenCode V2 CLI
        run: |
          set -euo pipefail
          test -x "$OPENCODE_V2_BIN"
          test "$("$OPENCODE_V2_BIN" --version)" = "opencode v2.0.20"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun test
      - run: bun run test:provider
      - run: bun run test:integration
      - run: bun run test:e2e
      - run: bun run test:e2e:v2
      - run: bun run verify:package
      - name: Verify the actual release payload
        run: |
          set -euo pipefail
          mkdir -p release
          umask 002
          bun pm pack --destination release --quiet
          shopt -s nullglob
          tarballs=(release/*.tgz)
          test "${#tarballs[@]}" -eq 1
          bun scripts/check-release-payload.ts "${tarballs[0]}"
